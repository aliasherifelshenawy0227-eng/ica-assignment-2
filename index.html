
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header and Search -->
        <header>
            <p>Deliver to</p>
            <h3>📍 Cairo, Egypt</h3>

            <input type="search"
                   placeholder="Search for products...">
        </header>

        <!-- Promotional Hero -->
        <section class="hero">
            <h2>Special Offers!</h2>
            <h1>Up to 50% OFF</h1>
            <p>Use your exclusive coupon</p>
            <span>SALE50</span>
        </section>

        <!-- Categories -->
        <section class="categories">
            <h2>Categories</h2>

            <div class="category-grid">
                <div>👕<p>Fashion</p></div>
                <div>📱<p>Electronics</p></div>
                <div>💄<p>Beauty</p></div>
                <div>🏠<p>Home</p></div>
            </div>
        </section>

        <!-- Featured Store -->
        <section class="featured">
            <h2>Featured Store</h2>

            <div class="store-card">
                <div class="store-banner"></div>

                <h3>Best Shopping Store</h3>
                <span>⭐ 4.8</span>
                <p>🚚 Delivery in 30 minutes</p>
            </div>
        </section>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#">🏠<br>Home</a>
        <a href="#">🔍<br>Explore</a>
        <a href="#">❤️<br>Favorites</a>
        <a href="#">👤<br>Profile</a>
    </nav>

</body>
</html>
